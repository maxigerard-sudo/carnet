<style>
:root{
  color-scheme:dark;
  --bg:#0F1B1F; --card:#16272C; --raise:#1E343A; --line:#27424A;
  --txt:#EAF2F1; --mut:#8AA3A8;
  --in:#F0A94C;   /* apports */
  --out:#4ECBA5;  /* dépense, progression */
  --hot:#FF7A5C;  /* alerte, série */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
     padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
main{max-width:660px;margin:0 auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:none;border:none;padding:0}
.t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.n1{font-size:46px;line-height:1} .n2{font-size:30px;line-height:1.1} .n3{font-size:20px}
.u{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* --- Hero série --- */
.hero{background:linear-gradient(150deg,#1B3138 0%,#16272C 60%);border:1px solid var(--line);
      border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.flame{font-size:34px;line-height:1;filter:saturate(1.2)}
.serie{display:flex;align-items:center;gap:12px}
.xpbar{height:8px;border-radius:99px;background:#0D181C;overflow:hidden;margin-top:6px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--out),#7FE3C0);width:0;transition:width .7s ease-out}

/* --- Bande de la semaine --- */
.semaine{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.jour{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pastille{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#12222700;
          display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0F1B1F;
          transition:transform .2s}
.jour:active .pastille{transform:scale(.92)}
.p-ok{background:var(--out);border-color:var(--out)}
.p-haut{background:var(--in);border-color:var(--in)}
.p-bas{border-color:var(--hot);color:var(--hot);background:none}
.p-sport{border-color:var(--out);color:var(--out);background:none}
.p-vide{border-style:dashed}
.p-sel{outline:2px solid var(--txt);outline-offset:2px}
.jlab{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.04em}

/* --- Barres --- */
.bar{height:14px;border-radius:99px;background:#0D181C;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;width:0;transition:width .6s ease-out}
.mini{height:6px}

/* --- Contrôles --- */
button{font-family:var(--sans);font-size:15px;font-weight:600;padding:12px 16px;border-radius:12px;border:none;
       background:var(--out);color:#08201A;cursor:pointer}
button.ghost{background:var(--raise);color:var(--txt);border:1px solid var(--line)}
button.s{padding:7px 12px;font-size:13px;border-radius:10px}
button.icon{background:none;border:none;color:var(--mut);padding:6px;font-size:15px}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--out);outline-offset:2px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--mut);padding:9px 0;border-radius:9px;font-size:14px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px #0006}
.chip{background:var(--raise);border:1px solid var(--line);color:var(--txt);font-size:13.5px;padding:8px 13px;border-radius:99px;font-weight:500}
.chip.on{background:var(--out);color:#08201A;border-color:var(--out);font-weight:700}
label>span{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);
             font-family:var(--mono);font-size:16px;color:var(--txt);outline:none;-webkit-appearance:none}
select{font-family:var(--sans);font-size:15px}
input:focus,select:focus{border-color:var(--out)}
input::placeholder{color:#5E767C}

.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px}
.line{border-top:1px solid var(--line)}
.warn{margin-top:12px;padding:11px 13px;border-radius:12px;background:#3A2320;color:#FFB5A3;font-size:13px}
.ok{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--raise);color:var(--txt);font-size:13px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:0 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line)}
.res{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--raise)}
.res button{width:100%;text-align:left;background:none;color:var(--txt);border-radius:0;display:flex;
            justify-content:space-between;font-size:14.5px;font-weight:500;border-bottom:1px solid var(--line)}
.hide{display:none}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover}

/* --- Badges --- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.badge{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.badge.got{border-color:var(--out);background:#173129}
.badge .em{font-size:24px;line-height:1.2;filter:grayscale(1);opacity:.35}
.badge.got .em{filter:none;opacity:1}
.badge .bl{font-size:10.5px;color:var(--mut);margin-top:5px;font-weight:600;line-height:1.25}
.badge.got .bl{color:var(--txt)}

/* --- Navigation --- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0F1B1FF2;backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav button{flex:1;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
           color:var(--mut);border-radius:0}
nav button.on{color:var(--out)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:10px;font-weight:600;letter-spacing:.02em}

/* --- Toast --- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
       background:var(--out);color:#08201A;font-weight:700;padding:12px 20px;border-radius:99px;font-size:14px;
       opacity:0;pointer-events:none;transition:all .3s;z-index:40;box-shadow:0 8px 24px #0007}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  r.onsuccess=()=>{db=r.result;ok()}; r.onerror=()=>ko(r.error);
});}
function dbGet(k){return new Promise(ok=>{ if(!db)return ok(null);
  const t=db.transaction("kv","readonly").objectStore("kv").get(k);
  t.onsuccess=()=>ok(t.result??null); t.onerror=()=>ok(null); });}
function dbSet(k,v){return new Promise(ok=>{ if(!db)return ok();
  const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
  t.onsuccess=()=>ok(); t.onerror=()=>ok(); });}

  if(p.objectif==="perte"){const mini=Math.max(p.sexe==="H"?1500:1200,base*.75);
    if(c<mini){c=mini;bride="Objectif ramené à un déficit sûr (25 % maximum, plancher physiologique).";}}
  const prot=rd(poids*(p.objectif==="perte"?1.8:1.6)), lip=rd(poids*.9);
  return {mb:rd(mb),base:rd(base),cible:rd(c),bride,prot,lip,gluc:rd(Math.max(0,(c-prot*4-lip*9)/4))};
}
function indic(m){
  if(!m||!m.poids)return null;
  const t=S.profile.taille/100, imc=m.poids/(t*t); let mg=null;
  if(m.ventre&&m.cou&&(S.profile.sexe==="H"||m.hanches)){
    mg=S.profile.sexe==="H"
      ?495/(1.0324-.19077*Math.log10(m.ventre-m.cou)+.15456*Math.log10(S.profile.taille))-450
      :495/(1.29579-.35004*Math.log10(m.ventre+m.hanches-m.cou)+.221*Math.log10(S.profile.taille))-450;
    if(!isFinite(mg)||mg<3||mg>65)mg=null;}
  return {imc:rd(imc,1),label:imc<18.5?"Insuffisance pondérale":imc<25?"Corpulence normale":imc<30?"Surpoids":"Obésité",
    rth:m.ventre?rd(m.ventre/S.profile.taille,2):null,mg:mg?rd(mg,1):null,mm:mg?rd(m.poids*(1-mg/100),1):null};
}
const kcalSeance=(met,min)=>rd(met*poidsActuel()*(min/60));
function jourData(k){const key=k||S.jour;if(!S.journal[key])S.journal[key]={repas:[],seances:[],sante:{}};return S.journal[key];}
function maj(){sauver();}
function vide(j){return !j||(!j.repas.length&&!j.seances.length);}

/* --- statut d'une journée (sert à la bande et aux récaps) --- */
function statut(k){
  const j=S.journal[k]; if(vide(j))return "vide";
  if(!j.repas.length)return "sport";
  const ap=somme(j.repas,"kcal"), o=cible().cible;
  if(ap>o*1.12)return "haut";
  if(ap<o*.72)return "bas";
  return "ok";
}
/* --- série, points, statistiques --- */
function stats(){
  const cles=Object.keys(S.journal).filter(k=>!vide(S.journal[k])).sort();
  const o=cible();
  let points=0,seances=0,joursProt=0,joursCrea=0;
  cles.forEach(k=>{
    const j=S.journal[k];
    points+=10; seances+=j.seances.length; points+=j.seances.length*20;
    if(somme(j.repas,"p")>=o.prot*.9){joursProt++;points+=10;}
    if(j.creatine){joursCrea++;points+=5;}
  });
  points+=S.mesures.length*10;
  // série en cours
  let serie=0, curseur=aujourdhui();
  if(vide(S.journal[curseur]))curseur=decale(curseur,-1);
  while(!vide(S.journal[curseur])){serie++;curseur=decale(curseur,-1);}
  // record
  let record=0,courant=0,prec=null;
  cles.forEach(k=>{ courant=(prec&&decale(prec,1)===k)?courant+1:1; record=Math.max(record,courant); prec=k; });
  // semaine complète ?
  let semainePleine=false;
  const l=lundi(aujourdhui());
  for(let w=0;w<8;w++){const d=decale(l,-7*w);
    if([0,1,2,3,4,5,6].every(i=>!vide(S.journal[decale(d,i)]))){semainePleine=true;break;}}
  const niveau=Math.floor(points/400)+1, dansNiveau=points%400;
  return {points,niveau,dansNiveau,serie,record,seances,joursProt,joursCrea,
          joursSuivis:cles.length,mesures:S.mesures.length,semainePleine};
}
function bilanJour(k){
  const j=jourData(k||S.jour),o=cible();
  const apports=somme(j.repas,"kcal"), sport=somme(j.seances,"kcal");
  const depense=(j.sante&&j.sante.kcalTotales)?j.sante.kcalTotales:o.base+sport;
  return {apports,sport,depense,o,solde:apports-depense};
}

function chargerPhoto(file){

  fr.onload=()=>{const img=new Image();
    img.onerror=()=>alerte("Cette image n'a pas pu être lue. Prenez la photo en JPEG ou PNG.");
    img.onload=()=>{
      const r=Math.min(1,1100/Math.max(img.width,img.height)),cv=document.createElement("canvas");
      cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/jpeg",.82); photo={url,b64:url.split(",")[1]};
      document.getElementById("apercu").innerHTML=`<div class="row ok pop" style="gap:12px">
        <img src="${url}" class="thumb" alt="Repas photographié">

        <button class="icon" onclick="retirerPhoto()" aria-label="Retirer">✕</button></div>`;};
    img.src=fr.result;};
  fr.readAsDataURL(file);
}

  const consigne=`Tu es un diététicien. Estime la composition nutritionnelle de ce repas${photo?" visible sur la photo":""}, en portions belges/françaises courantes.
${photo?"Identifie chaque aliment et estime les quantités à partir des repères visibles (assiette, couverts, verre).":""}
${texte.trim()?`Précisions : "${texte}"`:""}
Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni balises Markdown :
{"items":[{"nom":"aliment + quantité estimée","kcal":123,"p":10,"g":20,"l":5}]}
p/g/l en grammes. Sois réaliste et prudent. Si rien n'est identifiable, renvoie {"items":[]}.`;
  const contenu=photo?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:photo.b64}},{type:"text",text:consigne}]:consigne;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",

function agreger(cles){
  const o=cible(); let ap=0,pr=0,se=0,kcs=0,n=0,bas=0,crea=0;
  cles.forEach(k=>{const j=S.journal[k]; if(vide(j))return;
    n++; ap+=somme(j.repas,"kcal"); pr+=somme(j.repas,"p"); se+=j.seances.length; kcs+=somme(j.seances,"kcal");
    if(statut(k)==="bas")bas++; if(j.creatine)crea++;});
  return {n,ap,pr,se,kcs,bas,crea,moyAp:n?rd(ap/n):0,moyPr:n?rd(pr/n):0,o};
}
function deltaPoids(cles){
  const ms=mesuresTriees().filter(m=>cles.includes(m.date));
  if(ms.length<2)return null;
  return rd(ms[ms.length-1].poids-ms[0].poids,1);
}

  else if(a.n>=6) mot="Suivi régulier — c'est le facteur qui prédit le mieux le résultat à six mois.";

function ajouterMesure(){
  if(!draft.poids){toast("Le poids est nécessaire");return;}
  const m={date:draft.date||S.jour};
  ["poids","ventre","hanches","cou","poitrine","bras","cuisse"].forEach(k=>m[k]=draft[k]?Number(draft[k]):null);
  S.mesures=S.mesures.filter(x=>x.date!==m.date).concat([m]);
  sauver();rendre();toast("Mesure enregistrée · +10 pts");}
function suppMesure(d){S.mesures=S.mesures.filter(m=>m.date!==d);sauver();rendre();}
function courbe(ms){
  const W=600,H=200,P={t:14,r:14,b:26,l:38};
  const pts=ms.map(m=>({t:new Date(m.date+"T12:00:00").getTime(),v:m.poids,d:m.date}));
  const mm=pts.map(p=>{const w=pts.filter(q=>q.t<=p.t&&q.t>p.t-7*864e5);
    return {t:p.t,v:w.reduce((s,q)=>s+q.v,0)/w.length};});
  const vs=pts.map(p=>p.v).concat(S.profile.poidsCible?[S.profile.poidsCible]:[]);
  const min=Math.min(...vs)-1, max=Math.max(...vs)+1, t0=pts[0].t, t1=pts[pts.length-1].t||t0+1;
  const X=t=>P.l+(t1===t0?0:(t-t0)/(t1-t0))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Évolution du poids">
    ${[min,(min+max)/2,max].map(v=>`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="#27424A"/>
      <text x="2" y="${Y(v)+4}" font-size="11" fill="#8AA3A8">${v.toFixed(1)}</text>`).join("")}
    ${S.profile.poidsCible?`<line x1="${P.l}" y1="${Y(S.profile.poidsCible)}" x2="${W-P.r}" y2="${Y(S.profile.poidsCible)}"
      stroke="#4ECBA5" stroke-dasharray="5 5" opacity=".7"/>`:""}
    <path d="${path(pts)}" fill="none" stroke="#EAF2F1" stroke-width="1.2" opacity=".35"/>
    <path d="${path(mm)}" fill="none" stroke="#4ECBA5" stroke-width="2.6" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="2.6" fill="#EAF2F1" opacity=".5"/>`).join("")}
    <text x="${P.l}" y="${H-6}" font-size="11" fill="#8AA3A8">${pts[0].d.slice(5)}</text>
    <text x="${W-P.r}" y="${H-6}" font-size="11" fill="#8AA3A8" text-anchor="end">${pts[pts.length-1].d.slice(5)}</text></svg>`;
}

    <div class="row" style="flex-wrap:wrap;gap:7px">${MATERIEL.map(([id,l])=>
      `<button class="chip ${p.materiel.includes(id)?"on":""}" onclick="basculeMat('${id}')">${l}</button>`).join("")}</div></div>

  <div class="card"><div class="t">Compléments</div><div class="grid2">
    ${num("doseWhey","Dose de whey","g")}${num("doseCreatine","Dose de créatine","g")}</div></div>

  <div class="card"><div class="t">Analyse des repas</div>
    <label><span>Clé API Anthropic — reste sur cet appareil</span>
      <input type="password" value="${esc(p.cle||"")}" placeholder="sk-ant-…" oninput="setProfil('cle',this.value)"></label>
    <label style="margin-top:12px;display:block"><span>Modèle</span>
      <input value="${esc(p.modele||"")}" oninput="setProfil('modele',this.value)"></label>
    <div class="mut" style="margin-top:10px">Stockée en clair dans ce navigateur, envoyée uniquement à api.anthropic.com.
      Utilisez une clé dédiée, révocable séparément.</div></div>

  <div class="card"><div class="t">Vos repères</div><div class="grid2">
    <div><div class="u">Métabolisme de base</div><div class="num n2">${o.mb}</div></div>
    <div><div class="u">Dépense hors sport</div><div class="num n2">${o.base}</div></div>
    <div><div class="u">Cible d'apports</div><div class="num n2" style="color:var(--out)">${o.cible}</div></div>
    <div><div class="u">Protéines</div><div class="num n2">${o.prot} <span class="u">g</span></div></div></div>
    ${o.bride?`<div class="warn">${o.bride}</div>`:""}
    <div class="mut" style="margin-top:12px">Mifflin-St Jeor sur votre dernière pesée. Repères de suivi, pas un avis
      médical : pour un régime encadré, ou en cas de traitement, passez par un diététicien ou votre médecin.</div></div>

  <div class="card"><div class="t">Sauvegarde</div>
    <div class="mut" style="margin-bottom:14px">Les données vivent sur cet appareil. Exportez une copie régulièrement.</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="ghost s" onclick="exportJSON()">Copie JSON</button>
      <button class="ghost s" onclick="exportCSV()">Export CSV</button>
      <label class="chip" style="cursor:pointer">Restaurer
        <input type="file" accept="application/json" class="hide" onchange="importer(this.files[0])"></label></div>
    <div id="msg"></div><div class="mut" style="margin-top:12px" id="persist"></div></div>

  <div style="text-align:center;padding-bottom:8px">
    <button class="ghost" onclick="go('bilan')">Retour</button></div>`;
}
function setProfil(k,v){S.profile[k]=["sexe","objectif","cle","modele"].includes(k)?v:Number(v);
  sauver(); if(k==="objectif")rendre();}
function basculeMat(id){const m=S.profile.materiel,i=m.indexOf(id);
  i>=0?m.splice(i,1):m.push(id); if(!m.length)m.push("aucun"); sauver();rendre();}

/* ---------- Export / import ---------- */
function telecharger(txt,nom,type){const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportJSON(){const {cle,...prof}=S.profile;
  telecharger(JSON.stringify({version:2,profile:prof,mesures:S.mesures,journal:S.journal},null,2),
    "carnet-"+aujourdhui()+".json","application/json");}
function exportCSV(){
  const l=["date;poids;ventre;hanches;cou;poitrine;bras;cuisse;kcal_apports;proteines;kcal_seances;creatine_g;pas;sommeil"];
  const dates=[...new Set(S.mesures.map(m=>m.date).concat(Object.keys(S.journal)))].sort();
  dates.forEach(d=>{const m=S.mesures.find(x=>x.date===d)||{}, j=S.journal[d]||{repas:[],seances:[],sante:{}};
    l.push([d,m.poids,m.ventre,m.hanches,m.cou,m.poitrine,m.bras,m.cuisse,rd(somme(j.repas,"kcal")),
      rd(somme(j.repas,"p")),rd(somme(j.seances,"kcal")),j.creatine,(j.sante||{}).pas,(j.sante||{}).sommeil]
      .map(v=>v??"").join(";"));});
  telecharger("\uFEFF"+l.join("\n"),"carnet-"+aujourdhui()+".csv","text/csv");}
function importer(file){
  if(!file)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.profile&&!d.mesures)throw new Error();
      S.profile={...DEFAUT,...(d.profile||{}),cle:S.profile.cle};
      S.mesures=d.mesures||[]; S.journal=d.journal||{};
      sauver();rendre();toast("Sauvegarde restaurée");
    }catch(e){document.getElementById("msg").innerHTML=`<div class="warn">Fichier de sauvegarde invalide.</div>`;}};
  r.readAsText(file);}

/* ================================================================
   11. DÉMARRAGE
   ================================================================ */
(async function(){
  try{await ouvrirDB();}catch(e){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});}
  const core=await dbGet("core"), j=await dbGet("journal");
  if(core){S.profile={...DEFAUT,...(core.profile||{})}; S.mesures=core.mesures||[];}
  S.journal=j||{};
  rendre();
  if(navigator.storage&&navigator.storage.persist){
    const ok=await navigator.storage.persist();
    const el=document.getElementById("persist");
    if(el)el.textContent=ok?"Stockage marqué comme permanent par le navigateur."
      :"Stockage permanent non accordé — installez l'app sur l'écran d'accueil et exportez régulièrement.";}
})();
</script>
</body>
</html>
