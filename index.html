<style>
:root{
  color-scheme:dark;
  --bg:#0F1B1F; --card:#16272C; --raise:#1E343A; --line:#27424A;
  --txt:#EAF2F1; --mut:#8AA3A8;
  --in:#F0A94C;   /* apports */
  --out:#4ECBA5;  /* dépense, progression */
  --hot:#FF7A5C;  /* alerte, série */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
     padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto}
header{position:sticky;top:0;z-index:25;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 8px}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
main{max-width:660px;margin:0 auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:none;border:none;padding:0}
.t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.n1{font-size:46px;line-height:1} .n2{font-size:30px;line-height:1.1} .n3{font-size:20px}
.u{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* --- Hero série --- */
.hero{background:linear-gradient(150deg,#1B3138 0%,#16272C 60%);border:1px solid var(--line);
      border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.flame{font-size:34px;line-height:1;filter:saturate(1.2)}
.serie{display:flex;align-items:center;gap:12px}
.xpbar{height:8px;border-radius:99px;background:#0D181C;overflow:hidden;margin-top:6px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--out),#7FE3C0);width:0;transition:width .7s ease-out}

/* --- Bande de la semaine --- */
.semaine{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.jour{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pastille{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#12222700;
          display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0F1B1F;
          transition:transform .2s}
.jour:active .pastille{transform:scale(.92)}
.p-ok{background:var(--out);border-color:var(--out)}
.p-haut{background:var(--in);border-color:var(--in)}
.p-bas{border-color:var(--hot);color:var(--hot);background:none}
.p-sport{border-color:var(--out);color:var(--out);background:none}
.p-vide{border-style:dashed}
.p-sel{outline:2px solid var(--txt);outline-offset:2px}
.jlab{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.04em}

/* --- Barres --- */
.bar{height:14px;border-radius:99px;background:#0D181C;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;width:0;transition:width .6s ease-out}
.mini{height:6px}

/* --- Contrôles --- */
button{font-family:var(--sans);font-size:15px;font-weight:600;padding:12px 16px;border-radius:12px;border:none;
       background:var(--out);color:#08201A;cursor:pointer}
button.ghost{background:var(--raise);color:var(--txt);border:1px solid var(--line)}
button.s{padding:7px 12px;font-size:13px;border-radius:10px}
button.icon{background:none;border:none;color:var(--mut);padding:6px;font-size:15px}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--out);outline-offset:2px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--mut);padding:9px 0;border-radius:9px;font-size:14px}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px #0006}
.chip{background:var(--raise);border:1px solid var(--line);color:var(--txt);font-size:13.5px;padding:8px 13px;border-radius:99px;font-weight:500}
.chip.on{background:var(--out);color:#08201A;border-color:var(--out);font-weight:700}
label>span{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raise);
             font-family:var(--mono);font-size:16px;color:var(--txt);outline:none;-webkit-appearance:none}
select{font-family:var(--sans);font-size:15px}
input:focus,select:focus{border-color:var(--out)}
input::placeholder{color:#5E767C}

.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px}
.line{border-top:1px solid var(--line)}
.warn{margin-top:12px;padding:11px 13px;border-radius:12px;background:#3A2320;color:#FFB5A3;font-size:13px}
.ok{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--raise);color:var(--txt);font-size:13px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:0 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line)}
.res{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--raise)}
.res button{width:100%;text-align:left;background:none;color:var(--txt);border-radius:0;display:flex;
            justify-content:space-between;font-size:14.5px;font-weight:500;border-bottom:1px solid var(--line)}
.hide{display:none}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover}

/* --- Badges --- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.badge{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.badge.got{border-color:var(--out);background:#173129}
.badge .em{font-size:24px;line-height:1.2;filter:grayscale(1);opacity:.35}
.badge.got .em{filter:none;opacity:1}
.badge .bl{font-size:10.5px;color:var(--mut);margin-top:5px;font-weight:600;line-height:1.25}
.badge.got .bl{color:var(--txt)}

/* --- Navigation --- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0F1B1FF2;backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav button{flex:1;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
           color:var(--mut);border-radius:0}
nav button.on{color:var(--out)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:10px;font-weight:600;letter-spacing:.02em}

/* --- Toast --- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
       background:var(--out);color:#08201A;font-weight:700;padding:12px 20px;border-radius:99px;font-size:14px;
       opacity:0;pointer-events:none;transition:all .3s;z-index:40;box-shadow:0 8px 24px #0007}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

let db=null;
function ouvrirDB(){return new Promise((ok,ko)=>{
  const r=indexedDB.open("carnet-nutrition",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{db=r.result;ok()}; r.onerror=()=>ko(r.error);
});}
function dbGet(k){return new Promise(ok=>{ if(!db)return ok(null);
  const t=db.transaction("kv","readonly").objectStore("kv").get(k);
  t.onsuccess=()=>ok(t.result??null); t.onerror=()=>ok(null); });}
function dbSet(k,v){return new Promise(ok=>{ if(!db)return ok();
  const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
  t.onsuccess=()=>ok(); t.onerror=()=>ok(); });}

/* Horodatage local : sert d'arbitre face au champ maj distant. */
function touche(o){if(o&&typeof o==="object")o._maj=Date.now();return o;}

/* ================================================================
   3. CALCULS
   ================================================================ */
const rd=(n,d=0)=>isFinite(n)?Number(n.toFixed(d)):0;
function aujourdhui(dt=new Date()){return new Date(dt-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function decale(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return aujourdhui(d);}
function dateFr(k,o){return new Date(k+"T12:00:00").toLocaleDateString("fr-BE",o||{weekday:"long",day:"numeric",month:"long"});}
function lundi(k){const d=new Date(k+"T12:00:00");const j=(d.getDay()+6)%7;return decale(k,-j);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const somme=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);

function mesuresTriees(){return [...S.mesures].filter(m=>m.poids).sort((a,b)=>a.date.localeCompare(b.date));}
function poidsActuel(){const m=mesuresTriees();return m.length?m[m.length-1].poids:80;}
function cible(){
  const p=S.profile,poids=poidsActuel();
  const mb=10*poids+6.25*p.taille-5*p.age+(p.sexe==="H"?5:-161);
  const base=mb*p.activite, delta=p.rythme*7700/7;
  let c=p.objectif==="perte"?base-delta:p.objectif==="prise"?base+delta:base, bride=null;
  if(p.objectif==="perte"){const mini=Math.max(p.sexe==="H"?1500:1200,base*.75);
    if(c<mini){c=mini;bride="Objectif ramené à un déficit sûr (25 % maximum, plancher physiologique).";}}
  const prot=rd(poids*(p.objectif==="perte"?1.8:1.6)), lip=rd(poids*.9);
  return {mb:rd(mb),base:rd(base),cible:rd(c),bride,prot,lip,gluc:rd(Math.max(0,(c-prot*4-lip*9)/4))};
}
function indic(m){
  if(!m||!m.poids)return null;
  const t=S.profile.taille/100, imc=m.poids/(t*t); let mg=null;
  if(m.ventre&&m.cou&&(S.profile.sexe==="H"||m.hanches)){
    mg=S.profile.sexe==="H"
      ?495/(1.0324-.19077*Math.log10(m.ventre-m.cou)+.15456*Math.log10(S.profile.taille))-450
      :495/(1.29579-.35004*Math.log10(m.ventre+m.hanches-m.cou)+.221*Math.log10(S.profile.taille))-450;
    if(!isFinite(mg)||mg<3||mg>65)mg=null;}
  return {imc:rd(imc,1),label:imc<18.5?"Insuffisance pondérale":imc<25?"Corpulence normale":imc<30?"Surpoids":"Obésité",
    rth:m.ventre?rd(m.ventre/S.profile.taille,2):null,mg:mg?rd(mg,1):null,mm:mg?rd(m.poids*(1-mg/100),1):null};
}
const kcalSeance=(met,min)=>rd(met*poidsActuel()*(min/60));
function jourData(k){const key=k||S.jour;if(!S.journal[key])S.journal[key]={repas:[],seances:[],sante:{}};return S.journal[key];}
function maj(){touche(jourData());sauver();}
function vide(j){return !j||(!j.repas.length&&!j.seances.length);}

/* --- statut d'une journée (sert à la bande et aux récaps) --- */
function statut(k){
  const j=S.journal[k]; if(vide(j))return "vide";
  if(!j.repas.length)return "sport";
  const ap=somme(j.repas,"kcal"), o=cible().cible;
  if(ap>o*1.12)return "haut";
  if(ap<o*.72)return "bas";
  return "ok";
}
/* --- série, points, statistiques --- */
function stats(){
  const cles=Object.keys(S.journal).filter(k=>!vide(S.journal[k])).sort();
  const o=cible();
  let points=0,seances=0,joursProt=0,joursCrea=0;
  cles.forEach(k=>{
    const j=S.journal[k];
    points+=10; seances+=j.seances.length; points+=j.seances.length*20;
    if(somme(j.repas,"p")>=o.prot*.9){joursProt++;points+=10;}
    if(j.creatine){joursCrea++;points+=5;}
  });
  points+=S.mesures.length*10;
  // série en cours
  let serie=0, curseur=aujourdhui();
  if(vide(S.journal[curseur]))curseur=decale(curseur,-1);
  while(!vide(S.journal[curseur])){serie++;curseur=decale(curseur,-1);}
  // record
  let record=0,courant=0,prec=null;
  cles.forEach(k=>{ courant=(prec&&decale(prec,1)===k)?courant+1:1; record=Math.max(record,courant); prec=k; });
  // semaine complète ?
  let semainePleine=false;
  const l=lundi(aujourdhui());
  for(let w=0;w<8;w++){const d=decale(l,-7*w);
    if([0,1,2,3,4,5,6].every(i=>!vide(S.journal[decale(d,i)]))){semainePleine=true;break;}}
  const niveau=Math.floor(points/400)+1, dansNiveau=points%400;
  return {points,niveau,dansNiveau,serie,record,seances,joursProt,joursCrea,
          joursSuivis:cles.length,mesures:S.mesures.length,semainePleine};
}
/* ================================================================
   3bis. SUPABASE — authentification par code email + synchronisation
   Aucune librairie : appels REST directs, l'app reste un seul fichier.
   ================================================================ */
const sbActif=()=>!!(S.profile.sbUrl&&S.profile.sbKey);
const sbBase=()=>String(S.profile.sbUrl||"").replace(/\/+$/,"").replace(/\/rest\/v1$/,"");

async function sbAuth(chemin,corps){
  const r=await fetch(sbBase()+"/auth/v1/"+chemin,{method:"POST",
    headers:{"content-type":"application/json","apikey":S.profile.sbKey},
    body:JSON.stringify(corps)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.msg||d.error_description||d.error||("HTTP "+r.status));
  return d;
}
/* Inscription — nécessite « Confirm email » désactivé côté Supabase. */
async function sbInscrire(email,mdp){
  const d=await sbAuth("signup",{email,password:mdp});
  if(!d.access_token)throw new Error("CONFIRMATION_REQUISE");
  return poserSession(d,email);
}
/* Connexion classique. */
async function sbConnecter(email,mdp){
  const d=await sbAuth("token?grant_type=password",{email,password:mdp});
  return poserSession(d,email);
}
async function poserSession(d,email){
  if(!d.access_token)throw new Error("Réponse sans jeton");
  let uid=d.user&&d.user.id;
  if(!uid){ // sinon on lit le sub du JWT
    try{uid=JSON.parse(atob(d.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).sub;}catch(e){}
  }
  AUTH={access_token:d.access_token,refresh_token:d.refresh_token,
        expires_at:Date.now()+((d.expires_in||3600)-60)*1000,
        user_id:uid,email:email||(d.user&&d.user.email)||""};
  await dbSet("auth",AUTH);
  return AUTH;
}
async function sbJeton(){
  if(!AUTH)return null;
  if(Date.now()<AUTH.expires_at)return AUTH.access_token;
  try{
    const d=await sbAuth("token?grant_type=refresh_token",{refresh_token:AUTH.refresh_token});
    await poserSession(d,AUTH.email); return AUTH.access_token;
  }catch(e){AUTH=null;await dbSet("auth",null);return null;}
}
async function sbDeconnexion(){AUTH=null;await dbSet("auth",null);SYNC={etat:"off",msg:"",dernier:0};rendre();}

async function sbREST(table,opts){
  const jeton=await sbJeton(); if(!jeton)throw new Error("Session expirée");
  const o=opts||{};
  const r=await fetch(sbBase()+"/rest/v1/"+table+(o.query||""),{
    method:o.method||"GET",
    headers:{"apikey":S.profile.sbKey,"authorization":"Bearer "+jeton,
             "content-type":"application/json",
             ...(o.upsert?{"prefer":"resolution=merge-duplicates,return=minimal"}:{})},
    body:o.body?JSON.stringify(o.body):undefined});
  if(!r.ok){const t=await r.text().catch(()=>"");throw new Error("HTTP "+r.status+" "+t.slice(0,120));}
  return o.method&&o.method!=="GET"?null:r.json();
}

/* ---- Mise en forme locale <-> distante ---- */
const CH_MES=["poids","ventre","hanches","cou","poitrine","bras","cuisse"];
function versDistant(){
  const u=AUTH.user_id;
  return {
    profil:[{user_id:u,donnees:S.profile}],
    mesures:S.mesures.map(m=>{const o={user_id:u,date:m.date};CH_MES.forEach(k=>o[k]=m[k]??null);return o;}),
    journal:Object.keys(S.journal).map(d=>({user_id:u,date:d,
      repas:S.journal[d].repas||[],seances:S.journal[d].seances||[],
      sante:S.journal[d].sante||{},creatine:S.journal[d].creatine??null})),
    perfs:Object.keys(S.perfs||{}).flatMap(id=>(S.perfs[id]||[])
      .map(p=>({user_id:u,exo_id:id,date:p.date,sets:p.sets})))
  };
}
function fusionnerDistant(t,lignes){
  if(!lignes||!lignes.length)return 0;
  let n=0;
  if(t==="mesures"){
    lignes.forEach(r=>{
      const loc=S.mesures.find(m=>m.date===r.date);
      const distPlusRecent=!loc||!loc._maj||new Date(r.maj).getTime()>loc._maj;
      if(distPlusRecent){
        const m={date:r.date,_maj:new Date(r.maj).getTime()};
        CH_MES.forEach(k=>m[k]=r[k]!=null?Number(r[k]):null);
        S.mesures=S.mesures.filter(x=>x.date!==r.date).concat([m]);n++;}
    });
  }else if(t==="journal"){
    lignes.forEach(r=>{
      const loc=S.journal[r.date];
      if(!loc||!loc._maj||new Date(r.maj).getTime()>loc._maj){
        S.journal[r.date]={repas:r.repas||[],seances:r.seances||[],sante:r.sante||{},
          creatine:r.creatine!=null?Number(r.creatine):undefined,_maj:new Date(r.maj).getTime()};n++;}
    });
  }else if(t==="perfs"){
    S.perfs=S.perfs||{};
    lignes.forEach(r=>{
      const h=S.perfs[r.exo_id]||[];
      if(!h.some(p=>p.date===r.date)){h.push({date:r.date,sets:r.sets});n++;}
      S.perfs[r.exo_id]=h.sort((a,b)=>a.date.localeCompare(b.date)).slice(-20);
    });
  }else if(t==="profil"&&lignes[0]){
    const d=lignes[0].donnees||{};
    // Les identifiants restent locaux : jamais écrasés par le distant.
    S.profile={...S.profile,...d,cle:S.profile.cle,sbUrl:S.profile.sbUrl,sbKey:S.profile.sbKey};n++;
  }
  return n;
}

let tSync=null;
function planifierSync(){clearTimeout(tSync);tSync=setTimeout(()=>synchroniser(true),4000);}
async function synchroniser(silencieux){
  if(!sbActif()||!AUTH){if(!silencieux)toast("Connectez-vous d'abord");return;}
  if(SYNC.etat==="occupe")return;
  SYNC={...SYNC,etat:"occupe",msg:"Synchronisation…"};majBandeauSync();
  try{
    const d=versDistant();
    for(const t of ["profil","mesures","journal","perfs"])
      if(d[t].length) await sbREST(t,{method:"POST",upsert:true,body:d[t]});
    let recus=0;
    for(const t of ["profil","mesures","journal","perfs"]){
      const l=await sbREST(t,{query:"?select=*"});
      recus+=fusionnerDistant(t,l);
    }
    await dbSet("core",{profile:S.profile,mesures:S.mesures,perfs:S.perfs,courses:S.courses,listeFusion:S.listeFusion,coach:S.coach});
    await dbSet("journal",S.journal);
    SYNC={etat:"ok",msg:"À jour",dernier:Date.now()};
    if(recus&&!silencieux)rendre(); else majBandeauSync();
    if(!silencieux)toast("Synchronisé");
  }catch(e){
    SYNC={...SYNC,etat:"erreur",msg:String(e.message||e).slice(0,90)};
    majBandeauSync(); if(!silencieux)toast("Échec de la synchronisation");
  }
}
function majBandeauSync(){
  const el=document.getElementById("sync"); if(!el)return;
  const c={off:"var(--mut)",ok:"var(--out)",occupe:"var(--in)",erreur:"var(--hot)"}[SYNC.etat];
  const t=SYNC.etat==="ok"&&SYNC.dernier
    ? "Synchronisé à "+new Date(SYNC.dernier).toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"})
    : SYNC.msg||"Hors ligne";
  el.innerHTML=`<span style="color:${c}">●</span> <span class="mut">${esc(t)}</span>`;
}

function bilanJour(k){
  const j=jourData(k||S.jour),o=cible();
  const apports=somme(j.repas,"kcal"), sport=somme(j.seances,"kcal");
  const depense=(j.sante&&j.sante.kcalTotales)?j.sante.kcalTotales:o.base+sport;
  return {apports,sport,depense,o,solde:apports-depense};
}
/* --- tendance du poids : moyenne mobile 7 jours, écarts, ancienneté --- */
function tendance(){
  const ms=mesuresTriees(); if(!ms.length)return null;
  const last=ms[ms.length-1];
  const moy=k=>{const t=new Date(k+"T12:00:00").getTime();
    const w=ms.filter(m=>{const x=new Date(m.date+"T12:00:00").getTime();return x<=t&&x>t-7*864e5;});
    return w.length?w.reduce((s,m)=>s+m.poids,0)/w.length:null;};
  const now=moy(last.date), prec=moy(decale(last.date,-7));
  const cible7=S.profile.objectif==="perte"?-S.profile.rythme:S.profile.objectif==="prise"?S.profile.rythme:0;
  const depart=ms[0].poids, but=S.profile.poidsCible;
  const total=but?depart-but:0, fait=depart-last.poids;
  return {last,poids:last.poids,mm:now?rd(now,1):null,
    d7:(now!=null&&prec!=null)?rd(now-prec,1):null, cible7,
    depuisDepart:rd(last.poids-depart,1), depart,
    pct:total>0?Math.max(0,Math.min(100,rd(fait/total*100))):null,
    anciennete:Math.round((new Date(aujourdhui()+"T12:00:00")-new Date(last.date+"T12:00:00"))/864e5)};
}
function peseeRapide(){
  const el=document.getElementById("pesee"), v=Number(el&&el.value);
  if(!v||v<25||v>350){toast("Entrez un poids en kg");return;}
  const ex=S.mesures.find(m=>m.date===S.jour);
  if(ex){ex.poids=v;touche(ex);} else S.mesures.push(touche({date:S.jour,poids:v}));
  sauver();rendre();toast("Pesée enregistrée · +10 pts");
}

/* --- Appel API commun : erreurs lisibles et JSON tolérant --- */
function extraireJSON(t){
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a<0||b<a)throw new Error("Réponse illisible");
  return JSON.parse(t.slice(a,b+1));
}
async function claude(prompt,maxTokens){
  if(!S.profile.cle)throw new Error("Aucune clé API dans les réglages.");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":S.profile.cle,"anthropic-version":"2023-06-01",
             "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:S.profile.modele||"claude-sonnet-5",max_tokens:maxTokens||2000,
                         messages:[{role:"user",content:prompt}]})});
  const brut=await r.text();
  if(!r.ok){
    let m=brut; try{m=(JSON.parse(brut).error||{}).message||brut;}catch(e){}
    throw new Error("HTTP "+r.status+" — "+String(m).slice(0,160));
  }
  const d=JSON.parse(brut);
  if(d.stop_reason==="max_tokens")throw new Error("Réponse tronquée : augmentez la limite ou réduisez la demande.");
  return d.content.filter(c=>c.type==="text").map(c=>c.text).join("");
}

function chargerPhoto(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onerror=()=>alerte("Cette image n'a pas pu être lue. Prenez la photo en JPEG ou PNG.");
    img.onload=()=>{
      const r=Math.min(1,1100/Math.max(img.width,img.height)),cv=document.createElement("canvas");
      cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/jpeg",.82); photo={url,b64:url.split(",")[1]};
      document.getElementById("apercu").innerHTML=`<div class="row ok pop" style="gap:12px">
        <img src="${url}" class="thumb" alt="Repas photographié">
        <span style="flex:1">Photo prête — précisez une quantité si besoin, puis lancez l'analyse.</span>
        <button class="icon" onclick="retirerPhoto()" aria-label="Retirer">✕</button></div>`;};
    img.src=fr.result;};
  fr.readAsDataURL(file);
}

  const par=id=>dispo.find(s=>s.id===id);
  const n=Math.max(1,Math.min(6,p.jours)); let ids;
  if(salle){
    if(p.niveau<=1) ids=["fb-machines","fb-libre","fb-machines","fb-libre","fb-machines","fb-libre"].slice(0,n);
    else if(n<=2)   ids=["fb-libre","fb-machines"].slice(0,n);
    else if(n===3)  ids=["push","pull","jambes"];
    else if(n===4)  ids=["haut","bas","haut","bas"];

  }else ids=["fullbody-pdc","marche","core","course","fullbody-pdc","marche"].slice(0,n);

function contexteCoach(){
  const p=S.profile, t=tendance(), o=cible();

  const js=jours.map(k=>S.journal[k]).filter(x=>x&&!vide(x));
  const seances=js.flatMap(j=>j.seances||[]);
  const parSem=[0,1,2,3].map(w=>jours.slice(w*7,w*7+7)
    .reduce((n,k)=>n+((S.journal[k]||{}).seances||[]).length,0));
  const apports=js.map(j=>somme(j.repas,"kcal")).filter(x=>x>0);
  const moyAp=apports.length?rd(apports.reduce((a,b)=>a+b)/apports.length):null;
  const prot=js.map(j=>somme(j.repas,"p")).filter(x=>x>0);
  const moyPr=prot.length?rd(prot.reduce((a,b)=>a+b)/prot.length):null;
  const charges=Object.keys(S.perfs||{}).map(id=>{

CORPS
${t?`Poids ${t.poids} kg (moyenne 7 j ${t.mm}), variation ${t.d7!=null?t.d7+" kg/semaine":"inconnue"}, ${t.depuisDepart} kg depuis le début. Objectif ${p.poidsCible} kg. Dernière pesée il y a ${t.anciennete} j.`:"Aucune pesée enregistrée."}
Cible calorique calculée : ${o.cible} kcal, protéines ${o.prot} g.

4 DERNIÈRES SEMAINES
Jours renseignés : ${js.length}/28. Séances : ${seances.length} au total, par semaine (la plus récente d'abord) : ${parSem.join(", ")}.
Apports moyens : ${moyAp||"?"} kcal. Protéines moyennes : ${moyPr||"?"} g.
${sommeils.length?`Sommeil moyen ${rd(sommeils.reduce((a,b)=>a+b)/sommeils.length,1)} h.`:""}
${fc.length?`FC de repos moyenne ${rd(fc.reduce((a,b)=>a+b)/fc.length)} bpm.`:""}

CHARGES SOULEVÉES
${charges.length?charges.join("\n"):"Aucun historique de charges."}`;
}

function agreger(cles){
  const o=cible(); let ap=0,pr=0,se=0,kcs=0,n=0,bas=0,crea=0;
  cles.forEach(k=>{const j=S.journal[k]; if(vide(j))return;
    n++; ap+=somme(j.repas,"kcal"); pr+=somme(j.repas,"p"); se+=j.seances.length; kcs+=somme(j.seances,"kcal");
    if(statut(k)==="bas")bas++; if(j.creatine)crea++;});
  return {n,ap,pr,se,kcs,bas,crea,moyAp:n?rd(ap/n):0,moyPr:n?rd(pr/n):0,o};
}
function deltaPoids(cles){
  const ms=mesuresTriees().filter(m=>cles.includes(m.date));
  if(ms.length<2)return null;
  return rd(ms[ms.length-1].poids-ms[0].poids,1);
}
function blocRecap(titre,cles,sousTitre){
  const a=agreger(cles), dp=deltaPoids(cles), o=a.o;

  if(!a.n) mot="Rien de noté sur cette période. Une journée renseignée vaut mieux qu'une journée parfaite oubliée.";
  else if(a.bas>=Math.max(2,a.n/2)) mot="Plusieurs journées très en dessous de la cible. Manger à la cible et tenir six mois bat un déficit brutal qui casse au bout de trois semaines.";
  else if(a.se>=3) mot="Bon volume d'entraînement. C'est ce qui garde le muscle pendant que le poids descend.";
  else if(a.n>=6) mot="Suivi régulier — c'est le facteur qui prédit le mieux le résultat à six mois.";
  else mot="Régularité en construction. Visez d'abord le nombre de jours notés, le reste suit.";
  return `<div class="card">

        <div class="mut">cible ${o.prot}</div></div>

      ${attendu?`<div class="mut">Trajectoire visée sur la période : ${rd(attendu,1)} kg</div>`:""}</div>`:""}
    ${a.crea?`<div class="mut" style="margin-top:10px">Créatine prise ${a.crea} jour${a.crea>1?"s":""}.</div>`:""}

function graphePeriode(cles){

             border-radius:4px 4px 0 0;min-height:${v?"3px":"0"}"></div></div>`).join("")}</div>

function ajouterMesure(){
  if(!draft.poids){toast("Le poids est nécessaire");return;}
  const m={date:draft.date||S.jour};
  ["poids","ventre","hanches","cou","poitrine","bras","cuisse"].forEach(k=>m[k]=draft[k]?Number(draft[k]):null);
  touche(m);S.mesures=S.mesures.filter(x=>x.date!==m.date).concat([m]);
  sauver();rendre();toast("Mesure enregistrée · +10 pts");}
function suppMesure(d){S.mesures=S.mesures.filter(m=>m.date!==d);sauver();rendre();}
function courbe(ms){
  const W=600,H=200,P={t:14,r:14,b:26,l:38};
  const pts=ms.map(m=>({t:new Date(m.date+"T12:00:00").getTime(),v:m.poids,d:m.date}));
  const mm=pts.map(p=>{const w=pts.filter(q=>q.t<=p.t&&q.t>p.t-7*864e5);
    return {t:p.t,v:w.reduce((s,q)=>s+q.v,0)/w.length};});
  const vs=pts.map(p=>p.v).concat(S.profile.poidsCible?[S.profile.poidsCible]:[]);
  const min=Math.min(...vs)-1, max=Math.max(...vs)+1, t0=pts[0].t, t1=pts[pts.length-1].t||t0+1;
  const X=t=>P.l+(t1===t0?0:(t-t0)/(t1-t0))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-min)/(max-min||1))*(H-P.t-P.b);
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Évolution du poids">
    ${[min,(min+max)/2,max].map(v=>`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="#27424A"/>
      <text x="2" y="${Y(v)+4}" font-size="11" fill="#8AA3A8">${v.toFixed(1)}</text>`).join("")}
    ${S.profile.poidsCible?`<line x1="${P.l}" y1="${Y(S.profile.poidsCible)}" x2="${W-P.r}" y2="${Y(S.profile.poidsCible)}"
      stroke="#4ECBA5" stroke-dasharray="5 5" opacity=".7"/>`:""}
    <path d="${path(pts)}" fill="none" stroke="#EAF2F1" stroke-width="1.2" opacity=".35"/>
    <path d="${path(mm)}" fill="none" stroke="#4ECBA5" stroke-width="2.6" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="2.6" fill="#EAF2F1" opacity=".5"/>`).join("")}
    <text x="${P.l}" y="${H-6}" font-size="11" fill="#8AA3A8">${pts[0].d.slice(5)}</text>
    <text x="${W-P.r}" y="${H-6}" font-size="11" fill="#8AA3A8" text-anchor="end">${pts[pts.length-1].d.slice(5)}</text></svg>`;
}

    <div><div class="u">Dépense hors sport</div><div class="num n2">${o.base}</div></div>
    <div><div class="u">Cible d'apports</div><div class="num n2" style="color:var(--out)">${o.cible}</div></div>
    <div><div class="u">Protéines</div><div class="num n2">${o.prot} <span class="u">g</span></div></div></div>
    ${o.bride?`<div class="warn">${o.bride}</div>`:""}
    <div class="mut" style="margin-top:12px">Mifflin-St Jeor sur votre pesée du ${(mesuresTriees().slice(-1)[0]||{}).date||"—"}
      (${poidsActuel()} kg) : tout se recalcule à chaque nouvelle pesée. Repères de suivi, pas un avis
      médical : pour un régime encadré, ou en cas de traitement, passez par un diététicien ou votre médecin.</div></div>

  ${carteSync()}

  <div class="card"><div class="t">Sauvegarde locale</div>
    <div class="mut" style="margin-bottom:14px">Les données vivent sur cet appareil. Exportez une copie régulièrement.</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="ghost s" onclick="exportJSON()">Copie JSON</button>
      <button class="ghost s" onclick="exportCSV()">Export CSV</button>
      <label class="chip" style="cursor:pointer">Restaurer
        <input type="file" accept="application/json" class="hide" onchange="importer(this.files[0])"></label></div>
    <div id="msg"></div><div class="mut" style="margin-top:12px" id="persist"></div></div>

  <div class="card"><div class="t">Version de l'app</div>
    <div class="between">
      <div><div class="num n3">${VERSION}</div>
        <div class="mut">Si le numéro ne change pas après une mise en ligne, c'est le cache qui traîne.</div></div>
      <button class="ghost s" onclick="forcerMaj()" style="white-space:nowrap">Mettre à jour</button></div>
    <div class="mut" style="margin-top:12px">Ce bouton vide le cache et recharge la dernière version depuis le serveur.
      Vos données ne sont pas touchées — elles vivent dans une base séparée du cache.</div></div>

  <div style="text-align:center;padding-bottom:8px">
    <button class="ghost" onclick="go('bilan')">Retour</button></div>`;
}
function setProfil(k,v){S.profile[k]=["sexe","objectif","cle","modele"].includes(k)?v:Number(v);
  sauver(); if(k==="objectif")rendre();}
function basculeMat(id){const m=S.profile.materiel,i=m.indexOf(id);
  i>=0?m.splice(i,1):m.push(id); if(!m.length)m.push("aucun"); sauver();rendre();}

/* ---------- Carte connexion & synchronisation ---------- */
function carteSync(){
  const p=S.profile;
  return `<div class="card"><div class="between" style="margin-bottom:12px">
      <div class="t" style="margin:0">Synchronisation</div><div id="sync"></div></div>
    <label><span>URL du projet Supabase</span>
      <input value="${esc(p.sbUrl||"")}" placeholder="https://xxxx.supabase.co"
             oninput="setProfil('sbUrl',this.value)" style="font-size:13px"></label>
    <label style="margin-top:10px;display:block"><span>Clé publique (anon)</span>
      <input type="password" value="${esc(p.sbKey||"")}" placeholder="eyJhbGciOi…"
             oninput="setProfil('sbKey',this.value)"></label>

    ${!sbActif()?`<div class="mut" style="margin-top:12px">Renseignez les deux champs pour activer la connexion.</div>`
    : AUTH?`<div class="line" style="margin-top:14px;padding-top:14px">
        <div><div style="font-weight:600">${esc(AUTH.email||"Connecté")}</div>
          <div class="mut">Vos données sont sauvegardées sur votre base.</div></div>
        <div class="row" style="margin-top:12px;gap:8px">
          <button style="flex:1" onclick="synchroniser(false)">Synchroniser maintenant</button>
          <button class="ghost s" onclick="sbDeconnexion()">Déconnexion</button></div></div>`
    : `<div class="line" style="margin-top:14px;padding-top:14px">
        <label><span>Email</span>
          <input id="sbMail" type="email" inputmode="email" autocomplete="username"
                 placeholder="vous@exemple.be" style="font-family:var(--sans)"></label>
        <label style="margin-top:10px;display:block"><span>Mot de passe (8 caractères minimum)</span>
          <input id="sbMdp" type="password" autocomplete="current-password" placeholder="••••••••"></label>
        <div class="row" style="margin-top:12px;gap:8px">
          <button style="flex:1" id="btnCo" onclick="seConnecter()">Se connecter</button>
          <button class="ghost s" id="btnIn" onclick="creerCompte()">Créer le compte</button></div>
        <div id="authOut"></div>
        <div class="mut" style="margin-top:12px">La première fois, utilisez « Créer le compte ».</div></div>`}
  </div>`;
}
function lireIdent(){
  const m=(document.getElementById("sbMail")||{}).value||"";
  const p=(document.getElementById("sbMdp")||{}).value||"";
  const out=document.getElementById("authOut");
  if(!m.includes("@")){out.innerHTML=`<div class="warn">Adresse email invalide.</div>`;return null;}
  if(p.length<8){out.innerHTML=`<div class="warn">Le mot de passe doit faire au moins 8 caractères.</div>`;return null;}
  return {mail:m.trim(),mdp:p};
}
async function seConnecter(){
  const id=lireIdent(); if(!id)return;
  const b=document.getElementById("btnCo");b.disabled=true;b.innerHTML='<span class="spin">◠</span>';
  try{await sbConnecter(id.mail,id.mdp);rendre();toast("Connecté");await synchroniser(false);}
  catch(e){
    document.getElementById("authOut").innerHTML=`<div class="warn">${
      /invalid|credentials|grant/i.test(String(e.message))
      ? "Email ou mot de passe incorrect. Si c'est votre première connexion, utilisez « Créer le compte »."
      : esc(String(e.message||e).slice(0,110))}</div>`;
    b.disabled=false;b.innerHTML="Se connecter";}
}
async function creerCompte(){
  const id=lireIdent(); if(!id)return;
  const b=document.getElementById("btnIn");b.disabled=true;b.innerHTML='<span class="spin">◠</span>';
  try{await sbInscrire(id.mail,id.mdp);rendre();toast("Compte créé");await synchroniser(false);}
  catch(e){
    const msg=String(e.message||e);
    document.getElementById("authOut").innerHTML=`<div class="warn">${
      msg==="CONFIRMATION_REQUISE"
      ? "Supabase attend une confirmation par email. Dans le tableau de bord : Authentication → Sign In / Providers → Email → désactivez « Confirm email », puis réessayez."
      : /already|registered|exists/i.test(msg)
      ? "Ce compte existe déjà — utilisez « Se connecter »."
      : esc(msg.slice(0,110))}</div>`;
    b.disabled=false;b.innerHTML="Créer le compte";}
}

async function testerCle(){
  const out=document.getElementById("testOut"), b=document.getElementById("btnTest"), b0=b.innerHTML;
  b.disabled=true;b.innerHTML='<span class="spin">◠</span>';
  try{
    const t=await claude('Réponds uniquement : {"ok":true}',100);
    extraireJSON(t);
    out.innerHTML=`<div class="ok">Clé valide, modèle « ${esc(S.profile.modele||"claude-sonnet-5")} » joignable.</div>`;
  }catch(e){out.innerHTML=`<div class="warn">${esc(String(e.message||e))}</div>`;}
  b.disabled=false;b.innerHTML=b0;
}

/* ---------- Mise à jour forcée ---------- */
async function forcerMaj(){
  toast("Nettoyage du cache…");
  try{
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
    if(window.caches){
      const ks=await caches.keys();
      for(const k of ks) await caches.delete(k);
    }
  }catch(e){}
  // Le paramètre force le rechargement depuis le serveur plutôt que depuis la mémoire de Safari.
  location.replace(location.pathname+"?maj="+Date.now());
}

/* ---------- Export / import ---------- */
function telecharger(txt,nom,type){const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportJSON(){const {cle,...prof}=S.profile;
  telecharger(JSON.stringify({version:3,profile:prof,mesures:S.mesures,journal:S.journal,perfs:S.perfs},null,2),
    "carnet-"+aujourdhui()+".json","application/json");}
function exportCSV(){
  const l=["date;poids;ventre;hanches;cou;poitrine;bras;cuisse;kcal_apports;proteines;kcal_seances;creatine_g;pas;sommeil"];
  const dates=[...new Set(S.mesures.map(m=>m.date).concat(Object.keys(S.journal)))].sort();
  dates.forEach(d=>{const m=S.mesures.find(x=>x.date===d)||{}, j=S.journal[d]||{repas:[],seances:[],sante:{}};
    l.push([d,m.poids,m.ventre,m.hanches,m.cou,m.poitrine,m.bras,m.cuisse,rd(somme(j.repas,"kcal")),
      rd(somme(j.repas,"p")),rd(somme(j.seances,"kcal")),j.creatine,(j.sante||{}).pas,(j.sante||{}).sommeil]
      .map(v=>v??"").join(";"));});
  telecharger("\uFEFF"+l.join("\n"),"carnet-"+aujourdhui()+".csv","text/csv");}
function importer(file){
  if(!file)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.profile&&!d.mesures)throw new Error();
      S.profile={...DEFAUT,...(d.profile||{}),cle:S.profile.cle};
      S.mesures=d.mesures||[]; S.journal=d.journal||{}; S.perfs=d.perfs||{};
      sauver();rendre();toast("Sauvegarde restaurée");
    }catch(e){document.getElementById("msg").innerHTML=`<div class="warn">Fichier de sauvegarde invalide.</div>`;}};
  r.readAsText(file);}

/* ================================================================
   11. DÉMARRAGE
   ================================================================ */
(async function(){
  try{await ouvrirDB();}catch(e){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});}
  const core=await dbGet("core"), j=await dbGet("journal");
  if(core){S.profile={...DEFAUT,...(core.profile||{})}; S.mesures=core.mesures||[];
    S.perfs=core.perfs||{}; S.courses=core.courses||[]; S.listeFusion=core.listeFusion||[]; S.coach=core.coach||null;}
  S.journal=j||{};
  AUTH=await dbGet("auth");
  rendre();
  if(sbActif()&&AUTH){majBandeauSync();synchroniser(true);}
  // Resynchronise au retour au premier plan et au retour du réseau.
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)planifierSync();});
  window.addEventListener("online",()=>planifierSync());
  if(navigator.storage&&navigator.storage.persist){
    const ok=await navigator.storage.persist();
    const el=document.getElementById("persist");
    if(el)el.textContent=ok?"Stockage marqué comme permanent par le navigateur."
      :"Stockage permanent non accordé — installez l'app sur l'écran d'accueil et exportez régulièrement.";}
})();
</script>
